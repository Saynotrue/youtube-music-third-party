<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LyricsBar 초기 설정</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* 헤더 */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #1DB954, #0f7a38);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 20px rgba(29, 185, 84, 0.35);
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
    }

    /* 안내 */
    .guide {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .guide-title {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 2px;
    }

    .guide-step {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
    }

    .guide-step span {
      color: #1DB954;
      font-weight: 600;
    }

    #open-dashboard {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(29, 185, 84, 0.12);
      border: 1px solid rgba(29, 185, 84, 0.3);
      border-radius: 6px;
      color: #1DB954;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
      justify-content: center;
      margin-top: 2px;
    }

    #open-dashboard:hover {
      background: rgba(29, 185, 84, 0.2);
    }

    code {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: 'SF Mono', monospace;
      color: rgba(255, 255, 255, 0.8);
    }

    /* 폼 */
    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      padding: 10px 12px;
      font-size: 12px;
      font-family: 'SF Mono', monospace;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input::placeholder { color: rgba(255, 255, 255, 0.2); }

    input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(29, 185, 84, 0.5);
    }

    #error-msg {
      font-size: 11px;
      color: #ff5555;
      min-height: 16px;
    }

    #submit-btn {
      background: #1DB954;
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #submit-btn:hover { background: #22d15f; }
    #submit-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">♪</div>
      <h1>LyricsBar</h1>
      <p class="subtitle">Spotify API 키를 입력하면 바로 시작할 수 있어요</p>
    </div>

    <div class="guide">
      <div class="guide-title">처음 사용 설정</div>
      <div class="guide-step"><span>1.</span> 아래 버튼으로 Spotify 개발자 대시보드 열기</div>
      <div class="guide-step"><span>2.</span> Create App → Redirect URI에<br><code>http://127.0.0.1:8888/callback</code> 추가</div>
      <div class="guide-step"><span>3.</span> Client ID / Client Secret 복사 후 아래 입력</div>
      <button id="open-dashboard">↗ Spotify Developer Dashboard 열기</button>
    </div>

    <div class="form">
      <div class="input-group">
        <div class="input-label">Client ID</div>
        <input id="client-id" type="text" placeholder="32자리 hex 문자열">
      </div>
      <div class="input-group">
        <div class="input-label">Client Secret</div>
        <input id="client-secret" type="password" placeholder="32자리 hex 문자열">
      </div>
      <div id="error-msg"></div>
      <button id="submit-btn">시작하기</button>
    </div>
  </div>

  <script src="setup.js"></script>
</body>
</html>
