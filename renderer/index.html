<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 🎵 1. 기존 가사 바 모드 -->
  <div id="bar-mode" class="mode-active">
    <div id="bar">
      <img id="album-art" src="" alt="">
      <div id="track-info">
        <span id="title">곡을 재생해보세요</span>
        <span id="artist"></span>
      </div>
      <div id="lyrics-container">
        <span id="prev-lyric"></span>
        <span id="current-lyric"></span>
        <span id="next-lyric"></span>
      </div>
      <div id="equalizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div id="controls">
        <button id="btn-prev">⏮</button>
        <button id="btn-play-pause">⏸</button>
        <button id="btn-next">⏭</button>
      </div>
      <div id="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- 💿 LP 위젯 모드  -->
  <div id="lp-mode">
    <div class="lp-widget-bg">
      <!-- 회전하는 LP판 -->
      <div class="vinyl-record" id="vinyl-record">
        <img id="lp-widget-cover" src="" alt="cover">
        <div class="vinyl-hole"></div>
      </div>

      <!-- 곡 정보 및 컨트롤러 -->
      <div class="lp-footer">
        <div class="lp-top-row">
          <div class="lp-text-info">
            <div id="lp-widget-artist">Artist</div>
            <div id="lp-widget-title">Title</div>
          </div>
          <div class="lp-widget-controls">
            <button id="lp-btn-prev">⏮</button>
            <button id="lp-btn-play">⏯</button>
            <button id="lp-btn-next">⏭</button>
          </div>
        </div>
        <div id="lp-current-lyric" class="lp-lyric-text"></div>
        <div class="lp-progress-container">
          <div id="lp-progress-fill"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- ⚙️ 3. 설정 모달 -->
  <div id="settings-modal">
    <div id="settings-panel">

      <div id="settings-header">
        <div class="header-brand">
          <div class="brand-icon">♪</div>
          <div class="brand-info">
            <span class="brand-name">LyricsBar</span>
            <div class="license-status-row">
              <span id="license-status">Free</span>
              <button id="license-reset">초기화</button>
            </div>
          </div>
        </div>
        <button id="settings-close">✕</button>
      </div>

      <div class="s-divider"></div>

      <div class="settings-section">
        <div class="settings-label">라이센스 키</div>
        <div class="settings-row">
          <input id="license-input" type="text" placeholder="PRO-XXXX-XXXX-XXXX">
          <button id="license-activate">적용</button>
        </div>
        <div id="license-error">유효하지 않은 키입니다</div>
      </div>

      <div class="settings-section" id="service-selection-section">
        <div class="settings-label">플랫폼</div>
        <div class="theme-pills service-pills">
          <button class="theme-pill" onclick="changeService('youtube')">YouTube Music</button>
          <button class="theme-pill" onclick="changeService('spotify')">Spotify</button>
        </div>
      </div>

      <div class="s-divider"></div>

      <div id="opacity-section" class="settings-section">
        <div class="settings-row-between">
          <div class="settings-label">투명도 <span class="pro-badge">PRO</span></div>
          <span class="value-chip" id="opacity-value">100%</span>
        </div>
        <input id="opacity-slider" type="range" min="0.3" max="1" step="0.05" value="1">
      </div>

      <div class="settings-section settings-row-between">
        <div class="settings-label">자동 페이드 <span class="pro-badge">PRO</span></div>
        <label class="toggle">
          <input id="auto-fade-toggle" type="checkbox">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="settings-section">
        <div class="settings-label">위젯 스타일 <span class="pro-badge">PRO</span></div>
        <div class="theme-pills widget-style-pills">
          <!-- 🚨 data-widget="eq" 와 "lp" 가 반드시 있어야 합니다 -->
          <button class="theme-pill" data-widget="eq">Bar</button>
          <button class="theme-pill" data-widget="lp">LP</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">트레이 아이콘 <span class="pro-badge">PRO</span></div>
        <div class="theme-pills tray-icon-pills">
          <!-- 🚨 data-icon="player" 와 "spectrum" 이 반드시 있어야 합니다 -->
          <button class="theme-pill" data-icon="player">Note</button>
          <button class="theme-pill" data-icon="spectrum">Spectrum</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">가사 싱크 조절 <span class="pro-badge">PRO</span></div>
        <div class="stepper-row">
          <button id="offset-minus" class="stepper-btn">−100ms</button>
          <span id="offset-display">+600ms</span>
          <button id="offset-plus" class="stepper-btn">+100ms</button>
        </div>
      </div>

      <div class="s-divider"></div>

      <div class="settings-section settings-row-between">
        <div class="settings-label">항상 위에 표시 <span class="pro-badge">PRO</span></div>
        <label class="toggle">
          <input id="always-on-top-toggle" type="checkbox" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="settings-section settings-row-between">
        <div class="shortcut-label-group">
          <div class="settings-label">글로벌 단축키 <span class="pro-badge">PRO</span></div>
          <div class="shortcut-hint">⌘ Shift Space — 바 보이기 / 숨기기</div>
        </div>
        <label class="toggle">
          <input id="shortcuts-toggle" type="checkbox">
          <span class="toggle-slider"></span>
        </label>
      </div>

    </div>
  </div>

  <!-- 🔒 4. 업그레이드 모달 -->
  <div id="upgrade-modal">
    <div id="upgrade-panel">
      <div>🔒</div>
      <div>Pro 전용 기능</div>
      <p>이 기능은 Pro 버전에서 사용할 수 있어요</p>
      <button id="upgrade-close">닫기</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
